name: Deploy

# CD on merge: every push to main redeploys the VM — once the repository
# variable DEPLOY_ENABLED is "true" and the DEPLOY_* secrets exist (the
# contract is documented in deploy/README.md). Until then the job skips and
# the workflow stays green, so the pipeline is wired before the target exists.

on:
  push:
    branches: [main]

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Redeploy over SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
        run: |
          install -m 600 /dev/null key
          printf '%s\n' "$SSH_KEY" > key
          # redeploy.sh pulls main, rebuilds the two binaries, restarts the
          # units, and exits nonzero unless the collector (stores replayed),
          # the dashboard, and the gateway come back healthy — so a broken
          # deploy fails this workflow, not just the VM.
          ssh -i key -o StrictHostKeyChecking=accept-new "$USER@$HOST" \
            'sudo /opt/scope/deploy/redeploy.sh'
