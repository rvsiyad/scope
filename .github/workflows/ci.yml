name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: vet
        run: go vet ./...
      - name: test
        run: go test -race ./...
      - name: build
        run: go build ./...
      # A 1-second smoke of the benchmark suites: CI machines produce
      # meaningless numbers, but the suites must keep running — a broken
      # benchmark discovered at measurement time is a session lost.
      - name: bench smoke
        run: go run ./cmd/bench -duration 1s -ingest-rate 50 -query-rate 20 -overhead-rate 50
