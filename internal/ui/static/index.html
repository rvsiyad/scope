<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scope — live dashboards</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Scope</h1>
    <nav>
      <a href="./" class="active">Dashboards</a>
      <a href="traces.html">Traces</a>
    </nav>
    <div id="status" class="status" title="collector health">
      <span class="dot"></span><span id="status-text">connecting…</span>
    </div>
  </header>

  <div id="demo" class="demo">
    <button id="demo-run">Run demo</button>
    <div class="demo-text">
      <div id="demo-step">New here? This runs real requests through the gateway and walks through what lands on these charts.</div>
      <div id="demo-sub" class="demo-sub">it uses the same auth, rate limiting, cache, and provider path as any OpenAI SDK client, nothing is staged</div>
      <div id="demo-out" class="demo-out" hidden></div>
    </div>
    <div id="demo-dots" class="demo-dots">○○○○○</div>
  </div>

  <main id="charts" class="grid"></main>

  <script src="chart.js"></script>
  <script src="dashboard.js"></script>
  <script src="demo.js"></script>
</body>
</html>
